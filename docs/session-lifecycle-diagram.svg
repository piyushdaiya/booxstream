<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
<defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.12"/></filter><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0f766e"/></marker></defs>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="60" y="70" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="36" font-weight="800" fill="#0f172a">BooxStream Session Lifecycle</text>
<text x="60" y="105" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#475569">From host launch to clean teardown, with Android coordinating MediaProjection, encoding, transport, and UI state.</text>
<rect x="60" y="150" rx="24" ry="24" width="320" height="820" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="84" y="190" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="800" fill="#111827">Host CLI</text>
<rect x="420" y="150" rx="24" ry="24" width="320" height="820" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="444" y="190" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="800" fill="#111827">Android App</text>
<rect x="820" y="150" rx="24" ry="24" width="320" height="820" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
<text x="844" y="190" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="800" fill="#111827">Streaming Service</text>
<rect x="1220" y="150" rx="24" ry="24" width="320" height="820" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="1244" y="190" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="800" fill="#111827">Player / Recorder</text>
<g filter="url(#shadow)"><rect x="85" y="240" rx="18" ry="18" width="270" height="72" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<text x="105" y="274" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#111827">Launch session</text>
<text x="105" y="302" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#374151">booxcpy validates device</text>
<text x="105" y="326" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#374151">and starts MainActivity</text></g>
<g filter="url(#shadow)"><rect x="445" y="320" rx="18" ry="18" width="270" height="72" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
<text x="465" y="354" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#111827">Receive config</text>
<text x="465" y="382" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#374151">HostCommandReceiver stores preset</text>
<text x="465" y="406" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#374151">MainActivity consumes pending config</text></g>
<g filter="url(#shadow)"><rect x="445" y="400" rx="18" ry="18" width="270" height="72" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
<text x="465" y="434" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#111827">Request permission</text>
<text x="465" y="462" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#374151">User approves MediaProjection</text>
<text x="465" y="486" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#374151">capture prompt on device</text></g>
<g filter="url(#shadow)"><rect x="845" y="480" rx="18" ry="18" width="270" height="72" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
<text x="865" y="514" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#111827">Start service</text>
<text x="865" y="542" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#374151">Foreground service starts</text>
<text x="865" y="566" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#374151">notification becomes active</text></g>
<g filter="url(#shadow)"><rect x="845" y="565" rx="18" ry="18" width="270" height="72" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
<text x="865" y="599" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#111827">Open pipeline</text>
<text x="865" y="627" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#374151">VirtualDisplay feeds MediaCodec</text>
<text x="865" y="651" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#374151">encoder publishes IVF stream</text></g>
<g filter="url(#shadow)"><rect x="85" y="650" rx="18" ry="18" width="270" height="72" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<text x="105" y="684" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#111827">ADB forward ready</text>
<text x="105" y="712" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#374151">Host binds tcp:27183</text>
<text x="105" y="736" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#374151">and waits for decoder-safe start</text></g>
<g filter="url(#shadow)"><rect x="1245" y="730" rx="18" ry="18" width="270" height="72" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
<text x="1265" y="764" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#111827">Playback / recording</text>
<text x="1265" y="792" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#374151">ffplay shows mirror window</text>
<text x="1265" y="816" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#374151">optional IVF recording</text></g>
<g filter="url(#shadow)"><rect x="845" y="815" rx="18" ry="18" width="270" height="72" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
<text x="865" y="849" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#111827">Emit diagnostics</text>
<text x="865" y="877" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#374151">Android stats ticker logs</text>
<text x="865" y="901" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#374151">fps, kbps, frames, write errors</text></g>
<g filter="url(#shadow)"><rect x="85" y="900" rx="18" ry="18" width="270" height="72" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<text x="105" y="934" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#111827">Stop session</text>
<text x="105" y="962" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#374151">Host or user stops session</text>
<text x="105" y="986" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#374151">cleanup removes forward</text></g>
<g filter="url(#shadow)"><rect x="845" y="900" rx="18" ry="18" width="270" height="72" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
<text x="865" y="934" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#111827">Clean teardown</text>
<text x="865" y="962" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#374151">Service closes sockets, codec,</text>
<text x="865" y="986" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#374151">projection, and notification</text></g>
<line x1="220" y1="312" x2="220" y2="640" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="220" y1="722" x2="220" y2="890" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="580" y1="392" x2="580" y2="390" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="980" y1="552" x2="980" y2="555" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="980" y1="637" x2="980" y2="805" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="980" y1="887" x2="980" y2="890" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M355 276 C 400.0 276, 400.0 356, 445 356" stroke="#0f766e" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<path d="M715 436 C 780.0 436, 780.0 516, 845 516" stroke="#0f766e" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<path d="M845 600 C 600.0 600, 600.0 686, 355 686" stroke="#0f766e" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<path d="M355 686 C 800.0 686, 800.0 766, 1245 766" stroke="#0f766e" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<path d="M355 936 C 600.0 936, 600.0 936, 845 936" stroke="#0f766e" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<g filter="url(#shadow)"><rect x="100" y="990" rx="18" ry="18" width="1400" height="36" fill="#111827"/></g>
<text x="125" y="1014" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#f8fafc">Operational note: on Boox devices, &quot;Stay active in the background&quot; should be enabled to prevent aggressive ROM service termination.</text>
</svg>